[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Brio is a single-page app using BrowserRouter. Every deep link
# (/dashboard, /customers/CUS-101, /settings/audit …) must be served
# index.html so the client router can resolve it, instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints every file in /assets, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
